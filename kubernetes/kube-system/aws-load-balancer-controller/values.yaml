# Instalação via Helm:
# helm repo add eks https://aws.github.io/eks-charts
# helm repo update
# helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
#   -n kube-system -f values.yaml

clusterName: cloudlab-eks
region: us-east-1

serviceAccount:
  create: false
  name: aws-load-balancer-controller

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

podDisruptionBudget:
  maxUnavailable: 1

enableShield: false
enableWaf: false
enableWafv2: true
