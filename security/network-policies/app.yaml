# Nega todo tráfego por padrão no namespace app
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Permite ingress do ALB para o frontend (porta 80)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-frontend
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
---
# Permite ingress do ALB para o backend (porta 8080)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-backend
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
---
# Permite egress do backend para o RDS (porta 3306) e Redis (porta 6379)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 3306
        - port: 6379
        - port: 443   # AWS APIs (Secrets Manager, S3)
        - port: 53    # DNS
          protocol: UDP
---
# Permite egress do frontend para o backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes:
    - Egress
  egress:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: backend
      ports:
        - port: 8080
    - ports:
        - port: 53
          protocol: UDP
---
# Permite Prometheus scrape no namespace app
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
        - port: 80
