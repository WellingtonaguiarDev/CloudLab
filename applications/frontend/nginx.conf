worker_processes auto;

# Log de erros para stderr (coletado pelo Kubernetes).
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;

  sendfile        on;
  keepalive_timeout 65;

  # Diretórios de temp graváveis (necessário rodando como não-root).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota cai no index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Endpoint de saúde (probes do chart usam GET / na porta 80; este é extra).
    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # Métricas: o ServiceMonitor faz scrape em /metrics. nginx não expõe
    # métricas Prometheus nativas; retornamos um payload mínimo para o scrape
    # não falhar. Para métricas ricas, adicionar um nginx-prometheus-exporter.
    location = /metrics {
      access_log off;
      default_type text/plain;
      return 200 "# frontend up\nup 1\n";
    }
  }
}
