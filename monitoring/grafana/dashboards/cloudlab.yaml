apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudlab-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cloudlab.json: |
    {
      "title": "CloudLab Application",
      "uid": "cloudlab-app",
      "schemaVersion": 38,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"app\"}[5m])) by (app)",
              "legendFormat": "{{ app }}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error Rate (%)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"app\", status=~\"5..\"}[5m])) by (app) / sum(rate(http_requests_total{namespace=\"app\"}[5m])) by (app) * 100",
              "legendFormat": "{{ app }}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Latency p99 (s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"app\"}[5m])) by (app, le))",
              "legendFormat": "{{ app }} p99"
            }
          ]
        },
        {
          "id": 4,
          "title": "Pod Restarts",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(kube_pod_container_status_restarts_total{namespace=\"app\"}[15m])) by (pod)",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "id": 5,
          "title": "CPU Usage",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"app\"}[5m])) by (pod)",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Memory Usage (MB)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"app\"}) by (pod) / 1024 / 1024",
              "legendFormat": "{{ pod }}"
            }
          ]
        }
      ]
    }
