name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: cloudlab-eks

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Set image tag
        id: tag
        run: echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Deploy Backend
        run: |
          helm upgrade --install cloudlab-backend helm-charts/backend \
            --namespace app \
            --create-namespace \
            --set image.repository=${{ env.ECR_REGISTRY }}/backend \
            --set image.tag=${{ steps.tag.outputs.TAG }} \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ secrets.BACKEND_IRSA_ROLE_ARN }} \
            --set env.DB_HOST=${{ secrets.DB_HOST }} \
            --set env.REDIS_HOST=${{ secrets.REDIS_HOST }} \
            --atomic \
            --timeout 5m

      - name: Deploy Frontend
        run: |
          helm upgrade --install cloudlab-frontend helm-charts/frontend \
            --namespace app \
            --create-namespace \
            --set image.repository=${{ env.ECR_REGISTRY }}/frontend \
            --set image.tag=${{ steps.tag.outputs.TAG }} \
            --set env.API_URL=https://cloudlab.example.com/api \
            --atomic \
            --timeout 5m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/cloudlab-backend -n app --timeout=3m
          kubectl rollout status deployment/cloudlab-frontend -n app --timeout=3m
